# Composite action — Python 3.12 + pip cache
name: Setup Python
description: Install Python 3.12 with pip caching
inputs:
  python-version:
    description: Python version
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'