name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test:ci
      - run: pnpm build

  inference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: inference/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install ruff mypy pytest pytest-cov
      - run: ruff check .
      - run: mypy . || true   # non-blocking on initial scaffold
      - run: pytest --cov=. -q

  integration:
    needs: [web, inference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "E2E tests placeholder — wire Playwright when Vercel preview URL is stable"